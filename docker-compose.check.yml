services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sharesplit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sharesplit_secret}
      POSTGRES_DB: ${POSTGRES_DB:-sharesplit}
    volumes:
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sharesplit} -d ${POSTGRES_DB:-sharesplit}"]
      interval: 10s
      timeout: 2s
      retries: 8

  backend-check:
    build:
      context: ../backend
      dockerfile: Dockerfile.check
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-sharesplit}:${POSTGRES_PASSWORD:-sharesplit_secret}@postgres:5432/${POSTGRES_DB:-sharesplit}
      JWT_SECRET: ${JWT_SECRET:-check_secret_value}
      JWT_EXPIRES_IN: 7d
      CORS_ORIGIN: http://localhost:3000
      TRUST_PROXY: 0
      RATE_LIMIT_GLOBAL_MAX: 5000
      RATE_LIMIT_AUTH_MAX: 5000
      RATE_LIMIT_PAYMENTS_MAX: 5000
    depends_on:
      postgres:
        condition: service_healthy

  frontend-check:
    build:
      context: ../frontend
      dockerfile: Dockerfile.check
