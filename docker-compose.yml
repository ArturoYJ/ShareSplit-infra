services:
  postgres:
    image: postgres:16-alpine
    container_name: sharesplit_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sharesplit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sharesplit_secret}
      POSTGRES_DB: ${POSTGRES_DB:-sharesplit}
    ports:
      # Expuesto para que puedas conectarte desde Render, Vercel o tu entorno local
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    networks:
      - sharesplit_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sharesplit} -d ${POSTGRES_DB:-sharesplit}"]
      interval: 10s
      timeout: 2s
      retries: 5

volumes:
  postgres_data:
    name: sharesplit_postgres_data

networks:
  sharesplit_net:
    name: sharesplit_network
    driver: bridge
